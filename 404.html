<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost in transit — Brevabee Studios</title>
<meta name="theme-color" content="#080808">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'M PLUS Rounded 1c',system-ui,sans-serif;background:#080808;color:#f2f3f7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background-image:radial-gradient(900px 600px at 80% -10%,rgba(0,229,255,.16),transparent 60%),radial-gradient(720px 520px at 0% 32%,rgba(255,122,26,.11),transparent 60%);background-attachment:fixed}
  .wrap{max-width:520px}
  .code{font-size:140px;font-weight:800;letter-spacing:-4px;background:linear-gradient(90deg,#fff 0%,#58f6ff 60%,#ffc107 100%);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
  h1{font-size:28px;font-weight:800;margin:18px 0 10px}
  p{color:#9aa0ae;margin-bottom:28px;line-height:1.6}
  a.home{display:inline-flex;align-items:center;gap:10px;padding:13px 24px;border-radius:16px;font-weight:800;border:2px solid #f2f3f7;background:#0e0e13;color:#f2f3f7;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.55);transition:border-color .15s,box-shadow .15s}
  a.home:hover{border-color:#58f6ff;box-shadow:0 0 24px rgba(88,246,255,.45)}
  svg.bolt{width:44px;height:auto;margin-bottom:10px;filter:drop-shadow(0 0 12px rgba(255,193,7,.6))}
</style>
</head>
<body>
<div class="wrap">
  <svg class="bolt" viewBox="0 0 64 96" aria-hidden="true"><path d="M40 0 L0 56 L24 56 L18 96 L60 36 L36 36 Z" fill="#FFC107"/></svg>
  <div class="code">404</div>
  <h1>Lost in transit</h1>
  <p>The bolt couldn't reach this page. Maybe a tile slid out of place. Head back to the title screen and we'll get you sorted.</p>
  <a class="home" href="/">⚡ Back to home</a>
</div>
</body>
</html>
