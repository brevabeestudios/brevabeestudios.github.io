<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost in transit — Brevabee Studios</title>
<meta name="theme-color" content="#0A0F2E">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:#0a0f2e;color:#f4f6ff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background-image:radial-gradient(900px 600px at 80% -10%,rgba(0,229,255,.18),transparent 60%),radial-gradient(700px 500px at 0% 30%,rgba(255,0,170,.10),transparent 60%);background-attachment:fixed}
  .wrap{max-width:520px}
  .code{font-family:'Space Grotesk',sans-serif;font-size:140px;font-weight:700;letter-spacing:-4px;background:linear-gradient(90deg,#fff 0%,#00E5FF 60%,#FFC107 100%);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
  h1{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;margin:18px 0 10px}
  p{color:#9aa3c7;margin-bottom:28px;line-height:1.6}
  a.home{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:12px;font-weight:600;background:linear-gradient(135deg,#00E5FF,#1e90ff);color:#001028;text-decoration:none;box-shadow:0 0 24px rgba(0,229,255,.35)}
  a.home:hover{box-shadow:0 0 32px rgba(0,229,255,.55)}
  svg.bolt{width:44px;height:auto;margin-bottom:10px;filter:drop-shadow(0 0 12px rgba(255,193,7,.6))}
</style>
</head>
<body>
<div class="wrap">
  <svg class="bolt" viewBox="0 0 64 96" aria-hidden="true"><path d="M40 0 L0 56 L24 56 L18 96 L60 36 L36 36 Z" fill="#FFC107"/></svg>
  <div class="code">404</div>
  <h1>Lost in transit</h1>
  <p>The bolt couldn't reach this page. Maybe the path got rotated. Head back to the title screen and we'll get you sorted.</p>
  <a class="home" href="/">⚡ Back to home</a>
</div>
</body>
</html>
