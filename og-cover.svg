<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f2e"/>
      <stop offset="100%" stop-color="#1a2150"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="0%" r="50%">
      <stop offset="0%" stop-color="rgba(0,229,255,.35)"/>
      <stop offset="100%" stop-color="rgba(0,229,255,0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0%" cy="100%" r="50%">
      <stop offset="0%" stop-color="rgba(255,0,170,.20)"/>
      <stop offset="100%" stop-color="rgba(255,0,170,0)"/>
    </radialGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
